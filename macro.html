<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macro Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
      --text: #e8e8f0; --muted: #5a5a7a;
      --pos: #4ade80; --neg: #f87171; --neutral: #60a5fa;
      --risk-on: #4ade80; --risk-off: #f87171; --risk-neutral: #fbbf24;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 2rem; }
    nav { display: flex; gap: 0.75rem; margin-bottom: 2rem; align-items: center; flex-wrap: wrap; }
    nav a { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); text-decoration: none; padding: 4px 12px; border: 1px solid var(--border); border-radius: 4px; transition: all 0.15s; }
    nav a:hover { color: var(--text); border-color: var(--muted); }
    nav a.active { color: var(--text); border-color: var(--neutral); background: rgba(96,165,250,0.1); }
    header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
    .risk-badge { padding: 6px 16px; border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
    .risk-badge.risk-on  { background: rgba(74,222,128,0.15); color: var(--risk-on);      border: 1px solid rgba(74,222,128,0.4); }
    .risk-badge.risk-off { background: rgba(248,113,113,0.15); color: var(--risk-off);    border: 1px solid rgba(248,113,113,0.4); }
    .risk-badge.neutral  { background: rgba(251,191,36,0.15);  color: var(--risk-neutral); border: 1px solid rgba(251,191,36,0.4); }
    .risk-score { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
    .global-tf { display: flex; gap: 4px; margin-bottom: 2rem; align-items: center; }
    .global-tf-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-right: 6px; }
    .tf { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .tf:hover { color: var(--text); border-color: var(--muted); }
    .tf.active { background: var(--neutral); border-color: var(--neutral); color: #0a0a0f; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 2rem; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.3rem; }
    .stat-value { font-family: 'DM Mono', monospace; font-size: 1.15rem; font-weight: 500; }
    .stat-sub   { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
    .pos { color: var(--pos); } .neg { color: var(--neg); } .neu { color: var(--neutral); }
    .vix-low { color: var(--pos); } .vix-mid { color: var(--risk-neutral); } .vix-high { color: var(--neg); }
    .section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
    .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .chart-top  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
    .chart-title  { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .chart-latest { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }
    canvas { width: 100% !important; }
    .vix-zones { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .vix-zone  { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: 'DM Mono', monospace; }
    .vz-low  { background: rgba(74,222,128,0.15); color: var(--pos); }
    .vz-mid  { background: rgba(251,191,36,0.15);  color: var(--risk-neutral); }
    .vz-high { background: rgba(248,113,113,0.15); color: var(--neg); }
    .loading { text-align: center; padding: 6rem; color: var(--muted); font-family: 'DM Mono', monospace; }
    .dot { display: inline-block; animation: blink 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
    .error { color: #f87171; font-family: 'DM Mono', monospace; font-size: 13px; padding: 2rem; text-align: center; }
    .momentum-badge { font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .mom-accel-up   { background: rgba(74,222,128,0.18);  color: var(--pos); }
    .mom-up         { background: rgba(74,222,128,0.08);  color: var(--pos); }
    .mom-accel-down { background: rgba(248,113,113,0.18); color: var(--neg); }
    .mom-down       { background: rgba(248,113,113,0.08); color: var(--neg); }
    .mom-flat       { background: rgba(96,165,250,0.10);  color: var(--neutral); }
    .momentum-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; }
    .momentum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .momentum-card .mc-top { display: flex; justify-content: space-between; align-items: center; }
    .momentum-card .mc-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .momentum-card .mc-values { font-family: 'DM Mono', monospace; font-size: 0.85rem; display: flex; justify-content: space-between; }
    .momentum-card .mc-values span:first-child { color: var(--muted); }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <a href="/">📊 YTD Dashboard</a>
    <a href="/macro.html" class="active">🌍 Macro</a>
    <a href="/sector.html">🔄 Sector Rotatie</a>
    <a href="sector-deep.html">🔬 Deep Dive</a>
    <a href="/crypto.html">₿ Crypto</a>
    <a href="/metals.html">🥇 Edelmetalen</a>
    <a href="/commodities.html">⚡ Grondstoffen</a>
    <a href="/rendement.html">📈 Rendement</a>
  </nav>
  <header>
    <h1>Macro Dashboard</h1>
    <div class="risk-badge" id="risk-badge">Laden...</div>
    <div class="risk-score" id="risk-score"></div>
  </header>
  <div class="global-tf" id="global-tf">
    <span class="global-tf-label">Periode:</span>
    <button class="tf" data-days="30">1M</button>
    <button class="tf" data-days="90">3M</button>
    <button class="tf" data-days="180">6M</button>
    <button class="tf active" data-days="365">1J</button>
    <button class="tf" data-days="730">2J</button>
    <button class="tf" data-days="1460">4J</button>
  </div>
  <div id="content">
    <div class="loading">Data laden<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
  </div>
  <script>
    const CHARTS = {};
    let ALL_SERIES = {};
    let activeDays = 365;

    function cutSeries(series, days) {
      if (!series || !series.length) return [];
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - days);
      const cutStr = cutoff.toISOString().slice(0, 10);
      return series.filter(p => p.date >= cutStr);
    }

    function updateAllCharts(days) {
      activeDays = days;
      Object.entries(CHARTS).forEach(([id, entry]) => {
        const { chart, seriesKey, seriesKeys } = entry;
        if (seriesKeys) {
          // multi-line chart (bv. treasury 10Y/2Y of momentum dual)
          seriesKeys.forEach((key, idx) => {
            const sliced = cutSeries(resolveSeries(key), days);
            chart.data.datasets[idx].data = sliced.map(p => p.value);
            if (idx === 0) chart.data.labels = sliced.map(p => p.date);
          });
        } else {
          const sliced = cutSeries(resolveSeries(seriesKey), days);
          chart.data.labels = sliced.map(p => p.date);
          chart.data.datasets[0].data = sliced.map(p => p.value);
        }
        chart.update();
      });
    }

    // Ondersteunt geneste keys zoals "momentum.copperGold.d5"
    function resolveSeries(key) {
      return key.split(".").reduce((obj, k) => (obj ? obj[k] : undefined), ALL_SERIES);
    }

    document.getElementById("global-tf").addEventListener("click", e => {
      if (!e.target.classList.contains("tf")) return;
      document.querySelectorAll(".tf").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      updateAllCharts(parseInt(e.target.dataset.days));
    });

    function makeChart(canvasId, seriesKey, color, opts = {}) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      const series = cutSeries(resolveSeries(seriesKey), activeDays);
      if (!series.length) return;
      const plugins = [];
      if (opts.zones) {
        plugins.push({
          id: "zones-" + canvasId,
          beforeDraw(chart) {
            const { ctx: c, chartArea, scales } = chart;
            if (!chartArea) return;
            opts.zones.forEach(z => {
              const y = scales.y.getPixelForValue(z.val);
              c.save(); c.strokeStyle = z.color; c.lineWidth = 1; c.setLineDash([4, 4]);
              c.beginPath(); c.moveTo(chartArea.left, y); c.lineTo(chartArea.right, y); c.stroke();
              if (z.label) {
                c.fillStyle = z.color; c.font = "10px DM Mono, monospace";
                c.fillText(z.label, chartArea.left + 4, y - 4);
              }
              c.restore();
            });
          }
        });
      }
      const chart = new Chart(ctx, {
        type: "line", plugins,
        data: {
          labels: series.map(p => p.date),
          datasets: [{ data: series.map(p => p.value), borderColor: color, backgroundColor: opts.fill ? color + "15" : "transparent", fill: opts.fill ?? false, borderWidth: 1.5, pointRadius: 0, tension: 0.3 }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: "#12121a", borderColor: "#1e1e2e", borderWidth: 1, titleColor: "#5a5a7a", bodyColor: "#e8e8f0", callbacks: { label: ctx => ` ${opts.prefix ?? ""}${ctx.parsed.y?.toFixed(opts.decimals ?? 2)}${opts.suffix ?? ""}` } }
          },
          scales: {
            x: { grid: { color: "#1e1e2e" }, ticks: { color: "#5a5a7a", maxTicksLimit: 6, font: { family: "DM Mono", size: 10 } } },
            y: { grid: { color: "#1e1e2e" }, ticks: { color: "#5a5a7a", font: { family: "DM Mono", size: 10 }, callback: v => `${opts.prefix ?? ""}${typeof v === "number" ? v.toFixed(opts.decimals ?? 1) : v}${opts.suffix ?? ""}` } }
          }
        }
      });
      CHARTS[canvasId] = { chart, seriesKey, color, opts };
    }

    // Dual-line chart helper voor bv. 10Y/2Y of momentum 5d/20d
    function makeDualChart(canvasId, seriesKeyA, labelA, colorA, seriesKeyB, labelB, colorB, opts = {}) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      const seriesA = cutSeries(resolveSeries(seriesKeyA), activeDays);
      const seriesB = cutSeries(resolveSeries(seriesKeyB), activeDays);
      if (!seriesA.length && !seriesB.length) return;
      const plugins = [];
      if (opts.zones) {
        plugins.push({
          id: "zones-" + canvasId,
          beforeDraw(chart) {
            const { ctx: c, chartArea, scales } = chart;
            if (!chartArea) return;
            opts.zones.forEach(z => {
              const y = scales.y.getPixelForValue(z.val);
              c.save(); c.strokeStyle = z.color; c.lineWidth = 1; c.setLineDash([4, 4]);
              c.beginPath(); c.moveTo(chartArea.left, y); c.lineTo(chartArea.right, y); c.stroke();
              if (z.label) {
                c.fillStyle = z.color; c.font = "10px DM Mono, monospace";
                c.fillText(z.label, chartArea.left + 4, y - 4);
              }
              c.restore();
            });
          }
        });
      }
      const chart = new Chart(ctx, {
        type: "line", plugins,
        data: {
          labels: (seriesA.length ? seriesA : seriesB).map(p => p.date),
          datasets: [
            { label: labelA, data: seriesA.map(p => p.value), borderColor: colorA, borderWidth: 1.5, pointRadius: 0, tension: 0.3, backgroundColor: "transparent" },
            { label: labelB, data: seriesB.map(p => p.value), borderColor: colorB, borderWidth: 1.5, pointRadius: 0, tension: 0.3, backgroundColor: "transparent" },
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { labels: { color: "#5a5a7a", font: { family: "DM Mono", size: 10 } } },
            tooltip: { backgroundColor: "#12121a", borderColor: "#1e1e2e", borderWidth: 1, titleColor: "#5a5a7a", bodyColor: "#e8e8f0", callbacks: { label: ctx => ` ${ctx.dataset.label}: ${opts.prefix ?? ""}${ctx.parsed.y?.toFixed(opts.decimals ?? 2)}${opts.suffix ?? ""}` } }
          },
          scales: {
            x: { grid: { color: "#1e1e2e" }, ticks: { color: "#5a5a7a", maxTicksLimit: 6, font: { family: "DM Mono", size: 10 } } },
            y: { grid: { color: "#1e1e2e" }, ticks: { color: "#5a5a7a", font: { family: "DM Mono", size: 10 }, callback: v => `${opts.prefix ?? ""}${typeof v === "number" ? v.toFixed(opts.decimals ?? 1) : v}${opts.suffix ?? ""}` } }
          }
        }
      });
      CHARTS[canvasId] = { chart, seriesKeys: [seriesKeyA, seriesKeyB], opts };
    }

    function fmt(v, d = 2, pre = "", suf = "") {
      if (v === null || v === undefined) return "—";
      return `${pre}${parseFloat(v).toFixed(d)}${suf}`;
    }
    function vixClass(v)      { return v < 14 ? "vix-low" : v > 20 ? "vix-high" : "vix-mid"; }
    function buffettClass(v)  { return v > 175 ? "neg" : v > 125 ? "vix-mid" : "pos"; }
    function buffettLevel(v)  {
      if (v == null) return "—";
      return v > 200 ? "Extreem hoog" : v > 175 ? "Zeer hoog" : v > 150 ? "Verhoogd" : v > 100 ? "Fair value" : "Laag";
    }
    function deltaClass(arr) {
      if (!arr || arr.length < 20) return "neu";
      const last = arr[arr.length - 1]?.value;
      const prev = arr[arr.length - 20]?.value;
      return last > prev ? "pos" : last < prev ? "neg" : "neu";
    }
    // Voor reeksen waarbij een DALING gunstig is (bv. credit spreads):
    // "pos" (groen) als de waarde daalt, "neg" (rood) als die stijgt.
    function deltaClassInverse(arr) {
      if (!arr || arr.length < 20) return "neu";
      const last = arr[arr.length - 1]?.value;
      const prev = arr[arr.length - 20]?.value;
      return last < prev ? "pos" : last > prev ? "neg" : "neu";
    }

    const MOM_LABELS = {
      "accelerating-up":   "⬆⬆ Versnellend omhoog",
      "up":                "⬆ Stijgend",
      "accelerating-down": "⬇⬇ Versnellend omlaag",
      "down":              "⬇ Dalend",
      "flat":              "→ Vlak",
    };
    const MOM_CLASSES = {
      "accelerating-up":   "mom-accel-up",
      "up":                "mom-up",
      "accelerating-down": "mom-accel-down",
      "down":              "mom-down",
      "flat":              "mom-flat",
    };
    function momBadge(signal) {
      const cls = MOM_CLASSES[signal] ?? "mom-flat";
      const label = MOM_LABELS[signal] ?? "→ Vlak";
      return `<span class="momentum-badge ${cls}">${label}</span>`;
    }

    async function load() {
      try {
        const res  = await fetch("/api/macro");
        const json = await res.json();
        if (!json.ok) throw new Error(json.error);
        ALL_SERIES = json.series;
        render(json);
      } catch (err) {
        document.getElementById("content").innerHTML = `<div class="error">Kon data niet laden: ${err.message}</div>`;
      }
    }

    function render({ riskSignal, series, latest }) {
      const badge = document.getElementById("risk-badge");
      badge.className = `risk-badge ${riskSignal}`;
      const riskLabels = { "risk-on": "🟢 Risk On", "risk-off": "🔴 Risk Off", neutral: "🟡 Neutraal" };
      badge.textContent = riskLabels[riskSignal];
      const momPart = (latest.momentumScore || latest.sectorScore)
        ? ` (mom ${latest.momentumScore > 0 ? "+" : ""}${latest.momentumScore}, sector ${latest.sectorScore > 0 ? "+" : ""}${latest.sectorScore})`
        : "";
      document.getElementById("risk-score").textContent = `Score: ${latest.riskScore > 0 ? "+" : ""}${latest.riskScore} / 13${momPart}`;

      const hasHyOas = series.hyOasSeries && series.hyOasSeries.length > 0;

      document.getElementById("content").innerHTML = `
        <div class="stats">
          <div class="stat"><div class="stat-label">VIX</div><div class="stat-value ${vixClass(latest.vix)}">${fmt(latest.vix, 1)}</div><div class="stat-sub">${latest.vix < 14 ? "Laag — risk on" : latest.vix > 20 ? "Hoog — risk off" : "Neutraal"}</div></div>
          <div class="stat"><div class="stat-label">DXY Dollar</div><div class="stat-value ${deltaClass(series.dxy)}">${fmt(latest.dxy)}</div><div class="stat-sub">Dollar Index</div></div>
          <div class="stat"><div class="stat-label">WTI Crude</div><div class="stat-value ${deltaClass(series.wti)}">$${fmt(latest.wti)}</div><div class="stat-sub">per vat</div></div>
          <div class="stat"><div class="stat-label">Fed Funds</div><div class="stat-value neu">${fmt(latest.fedFunds, 2, "", "%")}</div><div class="stat-sub">Huidige rente</div></div>
          <div class="stat"><div class="stat-label">10Y Treasury</div><div class="stat-value ${deltaClass(series.treasury10y)}">${fmt(latest.treasury10y, 2, "", "%")}</div><div class="stat-sub">2Y: ${fmt(latest.treasury2y, 2, "", "%")}</div></div>
          <div class="stat"><div class="stat-label">Yield Curve</div><div class="stat-value ${latest.yieldCurve > 0 ? "pos" : "neg"}">${fmt(latest.yieldCurve, 2, "", "%")}</div><div class="stat-sub">10Y - 2Y</div></div>
          <div class="stat"><div class="stat-label">ERP</div><div class="stat-value ${latest.erp > 2 ? "pos" : latest.erp < 0 ? "neg" : "neu"}">${fmt(latest.erp, 2, "", "%")}</div><div class="stat-sub">Equity Risk Premium</div></div>
          <div class="stat"><div class="stat-label">CPI YoY</div><div class="stat-value ${latest.cpiYoY > 3 ? "neg" : latest.cpiYoY < 2 ? "pos" : "neu"}">${fmt(latest.cpiYoY, 2, "", "%")}</div><div class="stat-sub">MoM: ${fmt(latest.cpiMoM, 2, "", "%")}</div></div>
          <div class="stat"><div class="stat-label">High Beta/Value</div><div class="stat-value ${deltaClass(series.betaValue)}">${fmt(latest.betaValue, 3)}</div><div class="stat-sub">SPHB / VTV</div></div>
          <div class="stat"><div class="stat-label">Copper/Gold</div><div class="stat-value ${deltaClass(series.copperGold)}">${fmt(latest.copperGold, 3)}</div><div class="stat-sub">Conjunctuur</div></div>
          <div class="stat"><div class="stat-label">Jobless Claims</div><div class="stat-value ${deltaClass(series.jobless) === "pos" ? "neg" : "pos"}">${latest.jobless ? Math.round(latest.jobless).toLocaleString() : "—"}</div><div class="stat-sub">Wekelijks</div></div>
          <div class="stat"><div class="stat-label">M2 Groei YoY</div><div class="stat-value ${latest.m2YoY > 0 ? "pos" : "neg"}">${fmt(latest.m2YoY, 1, "", "%")}</div><div class="stat-sub">Geldgroei</div></div>
          <div class="stat"><div class="stat-label">Buffett Indicator</div><div class="stat-value ${buffettClass(latest.buffett)}">${fmt(latest.buffett, 1, "", "%")}</div><div class="stat-sub">${buffettLevel(latest.buffett)}</div></div>
          <div class="stat"><div class="stat-label">HY OAS</div><div class="stat-value ${deltaClassInverse(series.hyOasSeries)}">${fmt(latest.hyOas, 2, "", "%")}</div><div class="stat-sub">Credit stress (HY)</div></div>
          <div class="stat"><div class="stat-label">HY-IG Spread</div><div class="stat-value ${deltaClassInverse(series.hyIgSpread)}">${fmt(latest.hyIgSpread, 2, "", "%")}</div><div class="stat-sub">Flight to quality</div></div>
          <div class="stat"><div class="stat-label">MOVE Index</div><div class="stat-value ${deltaClassInverse(series.moveSeries)}">${latest.move !== null ? fmt(latest.move, 1) : "—"}</div><div class="stat-sub">Rentevolatiliteit</div></div>
          <div class="stat"><div class="stat-label">Discr./Staples</div><div class="stat-value ${deltaClass(series.discStaples)}">${fmt(latest.discStaples, 3)}</div><div class="stat-sub">XLY / XLP</div></div>
          <div class="stat"><div class="stat-label">Industr./Utilities</div><div class="stat-value ${deltaClass(series.indusUtil)}">${fmt(latest.indusUtil, 3)}</div><div class="stat-sub">XLI / XLU</div></div>
          <div class="stat"><div class="stat-label">Semis/Healthcare</div><div class="stat-value ${deltaClass(series.semisHealth)}">${fmt(latest.semisHealth, 3)}</div><div class="stat-sub">SMH / XLV</div></div>
          <div class="stat"><div class="stat-label">Growth/Value</div><div class="stat-value ${deltaClass(series.growthValue)}">${fmt(latest.growthValue, 3)}</div><div class="stat-sub">IWF / IWD · EPS-proxy</div></div>
        </div>

        <div class="section-title">🧭 Momentum — Vroege Rotatie-signalen</div>
        <div class="momentum-grid">
          <div class="momentum-card">
            <div class="mc-top"><div class="mc-label">Copper/Gold (5d momentum)</div>${momBadge(latest.momentumSignals?.copperGold)}</div>
            <div class="mc-values"><span>Laatste 5d %-verandering</span><span>${fmt(series.momentum?.copperGold?.d5?.slice(-1)[0]?.value, 2, "", "%")}</span></div>
          </div>
          <div class="momentum-card">
            <div class="mc-top"><div class="mc-label">High Beta/Value (5d momentum)</div>${momBadge(latest.momentumSignals?.betaValue)}</div>
            <div class="mc-values"><span>Laatste 5d %-verandering</span><span>${fmt(series.momentum?.betaValue?.d5?.slice(-1)[0]?.value, 2, "", "%")}</span></div>
          </div>
          <div class="momentum-card">
            <div class="mc-top"><div class="mc-label">HY OAS (5d momentum)</div>${momBadge(latest.momentumSignals?.hyOas)}</div>
            <div class="mc-values"><span>Laatste 5d verandering</span><span>${fmt(series.momentum?.hyOas?.d5?.slice(-1)[0]?.value, 2, "", " bps×100")}</span></div>
          </div>
          <div class="momentum-card">
            <div class="mc-top"><div class="mc-label">Discr./Staples (5d momentum)</div>${momBadge(latest.momentumSignals?.discStaples)}</div>
            <div class="mc-values"><span>Laatste 5d %-verandering</span><span>${fmt(series.momentum?.discStaples?.d5?.slice(-1)[0]?.value, 2, "", "%")}</span></div>
          </div>
          <div class="momentum-card">
            <div class="mc-top"><div class="mc-label">Industr./Utilities (5d momentum)</div>${momBadge(latest.momentumSignals?.indusUtil)}</div>
            <div class="mc-values"><span>Laatste 5d %-verandering</span><span>${fmt(series.momentum?.indusUtil?.d5?.slice(-1)[0]?.value, 2, "", "%")}</span></div>
          </div>
          <div class="momentum-card">
            <div class="mc-top"><div class="mc-label">Semis/Healthcare (5d momentum)</div>${momBadge(latest.momentumSignals?.semisHealth)}</div>
            <div class="mc-values"><span>Laatste 5d %-verandering</span><span>${fmt(series.momentum?.semisHealth?.d5?.slice(-1)[0]?.value, 2, "", "%")}</span></div>
          </div>
          <div class="momentum-card">
            <div class="mc-top"><div class="mc-label">Growth/Value (5d momentum)</div>${momBadge(latest.momentumSignals?.growthValue)}</div>
            <div class="mc-values"><span>Laatste 5d %-verandering</span><span>${fmt(series.momentum?.growthValue?.d5?.slice(-1)[0]?.value, 2, "", "%")}</span></div>
          </div>
        </div>
        <div class="grid-3" style="margin-top:1.25rem">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Copper/Gold — 5d vs 20d Momentum (%)</div></div>
            <canvas id="mom-coppergold-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">High Beta/Value — 5d vs 20d Momentum (%)</div></div>
            <canvas id="mom-betavalue-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">HY OAS — 5d vs 20d Momentum</div></div>
            <canvas id="mom-hyoas-chart" height="110"></canvas>
          </div>
        </div>
        <div class="grid-2" style="margin-top:1.25rem">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Discretionary/Staples — 5d vs 20d Momentum (%)</div></div>
            <canvas id="mom-discstaples-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Industrials/Utilities — 5d vs 20d Momentum (%)</div></div>
            <canvas id="mom-indusutil-chart" height="110"></canvas>
          </div>
        </div>
        <div class="grid-2" style="margin-top:1.25rem">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Semis/Healthcare — 5d vs 20d Momentum (%)</div></div>
            <canvas id="mom-semishealth-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Growth/Value — 5d vs 20d Momentum (%)</div></div>
            <canvas id="mom-growthvalue-chart" height="110"></canvas>
          </div>
        </div>

        <div class="section-title">Volatiliteit & Sentiment</div>
        <div class="grid-3">
          <div class="chart-wrap">
            <div class="chart-top">
              <div><div class="chart-title">VIX — Volatiliteitsindex</div><div class="vix-zones"><span class="vix-zone vz-low">Laag &lt;14</span><span class="vix-zone vz-mid">Neutraal 14-20</span><span class="vix-zone vz-high">Hoog &gt;20</span></div></div>
              <div class="chart-latest ${vixClass(latest.vix)}">${fmt(latest.vix, 1)}</div>
            </div>
            <canvas id="vix-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">High Beta vs Value — SPHB/VTV</div><div class="chart-latest ${deltaClass(series.betaValue)}">${fmt(latest.betaValue, 3)}</div></div>
            <canvas id="betavalue-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">MOVE Index — Rentevolatiliteit</div><div class="chart-latest ${deltaClassInverse(series.moveSeries)}">${latest.move !== null ? fmt(latest.move, 1) : "—"}</div></div>
            ${series.moveSeries && series.moveSeries.length ? '<canvas id="move-chart" height="110"></canvas>' : '<div style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--muted);text-align:center;padding:2.5rem 0">Geen data beschikbaar (^MOVE niet geleverd door Yahoo)</div>'}
          </div>
        </div>

        <div class="section-title">Credit Stress</div>
        <div class="grid-3">
          <div class="chart-wrap">
            <div class="chart-top">
              <div>
                <div class="chart-title">HY OAS — ICE BofA High Yield</div>
                <div class="vix-zones"><span class="vix-zone vz-low">Laag &lt;3%</span><span class="vix-zone vz-mid">Neutraal 3-5%</span><span class="vix-zone vz-high">Stress &gt;5%</span></div>
              </div>
              <div class="chart-latest ${deltaClassInverse(series.hyOasSeries)}">${fmt(latest.hyOas, 2, "", "%")}</div>
            </div>
            <canvas id="hyoas-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">IG OAS — ICE BofA Investment Grade</div><div class="chart-latest ${deltaClassInverse(series.igOasSeries)}">${fmt(latest.igOas, 2, "", "%")}</div></div>
            <canvas id="igoas-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">HY − IG Spread — Flight to Quality</div><div class="chart-latest ${deltaClassInverse(series.hyIgSpread)}">${fmt(latest.hyIgSpread, 2, "", "%")}</div></div>
            <canvas id="hyigspread-chart" height="110"></canvas>
          </div>
        </div>
        <div class="grid-2">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">LQD/HYG Ratio (secundaire credit proxy)</div><div class="chart-latest ${deltaClass(series.spreadSeries)}">${fmt(latest.spread, 3)}</div></div>
            <canvas id="spread-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Yield Curve (10Y - 2Y)</div><div class="chart-latest ${latest.yieldCurve > 0 ? "pos" : "neg"}">${fmt(latest.yieldCurve, 2, "", "%")}</div></div>
            <canvas id="yieldcurve-chart" height="110"></canvas>
          </div>
        </div>

        <div class="section-title">🔄 Sector Rotatie Ratio's</div>
        <div class="grid-2">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Discretionary/Staples — XLY/XLP (cyclisch vs defensief)</div><div class="chart-latest ${deltaClass(series.discStaples)}">${fmt(latest.discStaples, 3)}</div></div>
            <canvas id="discstaples-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Industrials/Utilities — XLI/XLU (cyclisch vs defensief)</div><div class="chart-latest ${deltaClass(series.indusUtil)}">${fmt(latest.indusUtil, 3)}</div></div>
            <canvas id="indusutil-chart" height="110"></canvas>
          </div>
        </div>
        <div class="grid-2">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Semis/Healthcare — SMH/XLV (groei vs defensief)</div><div class="chart-latest ${deltaClass(series.semisHealth)}">${fmt(latest.semisHealth, 3)}</div></div>
            <canvas id="semishealth-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top">
              <div>
                <div class="chart-title">Growth/Value — IWF/IWD</div>
                <div class="vix-zones"><span class="vix-zone vz-mid">Proxy voor EPS-revisie sentiment</span></div>
              </div>
              <div class="chart-latest ${deltaClass(series.growthValue)}">${fmt(latest.growthValue, 3)}</div>
            </div>
            <canvas id="growthvalue-chart" height="110"></canvas>
          </div>
        </div>

        <div class="section-title">Rente & Obligaties</div>
        <div class="grid-3">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">ERP — Equity Risk Premium</div><div class="chart-latest ${latest.erp > 2 ? "pos" : latest.erp < 0 ? "neg" : "neu"}">${fmt(latest.erp, 2, "", "%")}</div></div>
            <canvas id="erp-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Fed Funds Rate</div><div class="chart-latest neu">${fmt(latest.fedFunds, 2, "", "%")}</div></div>
            <canvas id="fedfunds-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">10Y vs 2Y Treasury Yield</div><div class="chart-latest ${deltaClass(series.treasury10y)}">${fmt(latest.treasury10y, 2, "", "%")}</div></div>
            <canvas id="treasury-chart" height="110"></canvas>
          </div>
        </div>

        <div class="section-title">Inflatie & Economie</div>
        <div class="grid-3">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">CPI Inflatie YoY %</div><div class="chart-latest ${latest.cpiYoY > 3 ? "neg" : "pos"}">${fmt(latest.cpiYoY, 2, "", "%")}</div></div>
            <canvas id="cpi-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">M2 Geldgroei YoY %</div><div class="chart-latest ${latest.m2YoY > 0 ? "pos" : "neg"}">${fmt(latest.m2YoY, 1, "", "%")}</div></div>
            <canvas id="m2-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Initial Jobless Claims</div><div class="chart-latest ${deltaClass(series.jobless) === "pos" ? "neg" : "pos"}">${latest.jobless ? Math.round(latest.jobless).toLocaleString() : "—"}</div></div>
            <canvas id="jobless-chart" height="110"></canvas>
          </div>
        </div>

        <div class="section-title">Grondstoffen & Marktratios</div>
        <div class="grid-3">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">WTI Crude Oil</div><div class="chart-latest ${deltaClass(series.wti)}">$${fmt(latest.wti)}</div></div>
            <canvas id="wti-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">SPX / Goud Ratio</div><div class="chart-latest ${deltaClass(series.spxGold)}">${fmt(latest.spxGold, 3)}</div></div>
            <canvas id="spxgold-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">Copper / Gold Ratio</div><div class="chart-latest ${deltaClass(series.copperGold)}">${fmt(latest.copperGold, 3)}</div></div>
            <canvas id="coppergold-chart" height="110"></canvas>
          </div>
        </div>

        <div class="section-title">Dollar</div>
        <div class="grid-2">
          <div class="chart-wrap">
            <div class="chart-top"><div class="chart-title">DXY — Dollar Index</div><div class="chart-latest ${deltaClass(series.dxy)}">${fmt(latest.dxy)}</div></div>
            <canvas id="dxy-chart" height="110"></canvas>
          </div>
          <div class="chart-wrap" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.5rem;">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;">Risk Score Breakdown</div>
            <div style="font-family:'DM Mono',monospace;font-size:2.5rem;font-weight:500;color:${latest.riskScore >= 2 ? 'var(--pos)' : latest.riskScore <= -2 ? 'var(--neg)' : 'var(--risk-neutral)'}">
              ${latest.riskScore > 0 ? "+" : ""}${latest.riskScore}
            </div>
            <div style="font-size:11px;color:var(--muted);text-align:center;line-height:1.8">
              VIX ${latest.vix < 14 ? "✅ Laag" : latest.vix > 20 ? "❌ Hoog" : "⚠️ Mid"}<br>
              Beta/Value ${deltaClass(series.betaValue) === "pos" ? "✅ Stijgend" : "❌ Dalend"}<br>
              Yield Curve ${latest.yieldCurve > 0.5 ? "✅ Positief" : latest.yieldCurve < -0.3 ? "❌ Invers" : "⚠️ Vlak"}<br>
              ERP ${latest.erp > 2 ? "✅ Hoog" : latest.erp < 0 ? "❌ Negatief" : "⚠️ Mid"}<br>
              Copper/Gold ${deltaClass(series.copperGold) === "pos" ? "✅ Stijgend" : "❌ Dalend"}<br>
              HY OAS ${deltaClassInverse(series.hyOasSeries) === "pos" ? "✅ Dalend" : "❌ Stijgend"}<br>
              Momentum ${latest.momentumScore > 0 ? `✅ +${latest.momentumScore}` : latest.momentumScore < 0 ? `❌ ${latest.momentumScore}` : "⚠️ 0"}<br>
              Sector Rotatie ${latest.sectorScore > 0 ? `✅ +${latest.sectorScore}` : latest.sectorScore < 0 ? `❌ ${latest.sectorScore}` : "⚠️ 0"}
              <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:6px;font-size:9px;text-align:left">
                Sector Rotatie = Discr/Staples, Indus/Util, Semis/Health, Growth/Value (elk +1/-1 op 20d verandering)
              </div>
            </div>
          </div>
        </div>

        <div class="section-title">📊 Buffett Indicator — Marktwaardering</div>
        <div class="grid-2">
          <div class="chart-wrap">
            <div class="chart-top">
              <div>
                <div class="chart-title">Wilshire 5000 Full Cap / US GDP</div>
                <div class="vix-zones" style="margin-top:5px">
                  <span class="vix-zone vz-low">&lt;100% fair value</span>
                  <span class="vix-zone vz-mid">100–150% verhoogd</span>
                  <span class="vix-zone vz-high">&gt;150% extreem</span>
                </div>
              </div>
              <div>
                <div class="chart-latest ${buffettClass(latest.buffett)}">${fmt(latest.buffett, 1, "", "%")}</div>
                <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:right;margin-top:2px">${buffettLevel(latest.buffett)}</div>
              </div>
            </div>
            <canvas id="buffett-chart" height="160"></canvas>
          </div>
          <div class="chart-wrap" style="display:flex;flex-direction:column;gap:0.75rem;justify-content:space-between">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em">Referentieniveaus</div>
            <div style="display:flex;flex-direction:column;gap:10px;font-family:'DM Mono',monospace;font-size:11px;flex:1;justify-content:center">
              <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Dot-com piek (2000)</span><span style="color:var(--neg)">~183%</span></div>
              <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Post-COVID piek (2021)</span><span style="color:var(--neg)">~211%</span></div>
              <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Pre-crisis piek (2007)</span><span style="color:var(--risk-neutral)">~107%</span></div>
              <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Historisch gemiddelde</span><span style="color:var(--pos)">~85–100%</span></div>
              <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Buffett waarschuwingsgrens</span><span style="color:var(--risk-neutral)">&gt;140%</span></div>
              <div style="border-top:1px solid var(--border);padding-top:10px;color:var(--muted);font-size:10px;line-height:1.7">
                Bron: FRED WILL5000INDFC / GDP<br>
                Kwartaaldata — forward-filled naar meest recente kwartaalcijfer
              </div>
            </div>
          </div>
        </div>
      `;

      makeChart("vix-chart",        "vix",           "#f472b6", { decimals: 1, zones: [{ val: 14, color: "rgba(74,222,128,0.5)" }, { val: 20, color: "rgba(248,113,113,0.5)" }] });
      makeChart("betavalue-chart",  "betaValue",     "#fb923c", { decimals: 3 });
      makeChart("yieldcurve-chart", "yieldCurve",    "#60a5fa", { decimals: 2, suffix: "%", zones: [{ val: 0, color: "rgba(96,165,250,0.4)" }] });
      makeChart("erp-chart",        "erp",           "#4ade80", { decimals: 2, suffix: "%", zones: [{ val: 0, color: "rgba(248,113,113,0.4)" }, { val: 2, color: "rgba(74,222,128,0.4)" }] });
      makeChart("spread-chart",     "spreadSeries",  "#f87171", { decimals: 3 });
      makeChart("fedfunds-chart",   "fedFunds",      "#a78bfa", { decimals: 2, suffix: "%" });
      makeChart("cpi-chart",        "cpiYoY",        "#fbbf24", { decimals: 2, suffix: "%", fill: true });
      makeChart("m2-chart",         "m2YoY",         "#22d3ee", { decimals: 1, suffix: "%" });
      makeChart("jobless-chart",    "jobless",       "#e879f9", { decimals: 0 });
      makeChart("wti-chart",        "wti",           "#34d399", { decimals: 2, prefix: "$" });
      makeChart("spxgold-chart",    "spxGold",       "#a78bfa", { decimals: 3 });
      makeChart("coppergold-chart", "copperGold",    "#fbbf24", { decimals: 3 });
      makeChart("dxy-chart",        "dxy",           "#60a5fa", { decimals: 2 });

      // ── Credit stress charts (HY OAS / IG OAS / HY-IG spread) ───────
      makeChart("hyoas-chart", "hyOasSeries", "#f87171", {
        decimals: 2, suffix: "%",
        zones: [
          { val: 3, color: "rgba(74,222,128,0.5)",  label: "3%" },
          { val: 5, color: "rgba(248,113,113,0.5)", label: "5%" },
        ]
      });
      makeChart("igoas-chart",      "igOasSeries", "#fb923c", { decimals: 2, suffix: "%" });
      makeChart("hyigspread-chart", "hyIgSpread",  "#e879f9", { decimals: 2, suffix: "%" });

      // MOVE Index — kan leeg zijn als Yahoo geen data levert voor ^MOVE
      if (series.moveSeries && series.moveSeries.length) {
        makeChart("move-chart", "moveSeries", "#22d3ee", { decimals: 1 });
      }

      // ── Momentum charts: 5d vs 20d rate-of-change ────────────────────
      makeDualChart("mom-coppergold-chart", "momentum.copperGold.d5", "5d %", "#fbbf24", "momentum.copperGold.d20", "20d %", "#5a5a7a", { decimals: 2, suffix: "%" });
      makeDualChart("mom-betavalue-chart",  "momentum.betaValue.d5",  "5d %", "#fb923c", "momentum.betaValue.d20",  "20d %", "#5a5a7a", { decimals: 2, suffix: "%" });
      makeDualChart("mom-hyoas-chart",      "momentum.hyOas.d5",      "5d Δ",  "#f87171", "momentum.hyOas.d20",      "20d Δ", "#5a5a7a", { decimals: 2, suffix: "%" });
      makeDualChart("mom-discstaples-chart", "momentum.discStaples.d5", "5d %", "#4ade80", "momentum.discStaples.d20", "20d %", "#5a5a7a", { decimals: 2, suffix: "%" });
      makeDualChart("mom-indusutil-chart",   "momentum.indusUtil.d5",   "5d %", "#60a5fa", "momentum.indusUtil.d20",   "20d %", "#5a5a7a", { decimals: 2, suffix: "%" });
      makeDualChart("mom-semishealth-chart", "momentum.semisHealth.d5", "5d %", "#f472b6", "momentum.semisHealth.d20", "20d %", "#5a5a7a", { decimals: 2, suffix: "%" });
      makeDualChart("mom-growthvalue-chart", "momentum.growthValue.d5", "5d %", "#a78bfa", "momentum.growthValue.d20", "20d %", "#5a5a7a", { decimals: 2, suffix: "%" });

      // ── Sector rotatie ratio's (niveau) ──────────────────────────────
      makeChart("discstaples-chart", "discStaples", "#4ade80", { decimals: 3 });
      makeChart("indusutil-chart",   "indusUtil",   "#60a5fa", { decimals: 3 });
      makeChart("semishealth-chart", "semisHealth", "#f472b6", { decimals: 3 });
      makeChart("growthvalue-chart", "growthValue", "#a78bfa", { decimals: 3 });


      // Buffett Indicator — referentielijnen met label
      makeChart("buffett-chart", "buffettSeries", "#a78bfa", {
        decimals: 1, suffix: "%", fill: true,
        zones: [
          { val: 100, color: "rgba(74,222,128,0.5)",  label: "100%" },
          { val: 150, color: "rgba(251,191,36,0.5)",  label: "150%" },
          { val: 200, color: "rgba(248,113,113,0.5)", label: "200%" },
        ]
      });

      // Treasury dual line (10Y + 2Y)
      makeDualChart("treasury-chart", "treasury10y", "10Y", "#60a5fa", "treasury2y", "2Y", "#f472b6", { decimals: 2, suffix: "%" });
    }

    load();
  </script>
</body>
</html>
