  <meta charset="UTF-8" />

  <title>YTD Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
      --text: #e8e8f0; --muted: #5a5a7a; --pos: #4ade80; --neg: #f87171;
      --accent: #60a5fa;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 2rem; }
    nav { display: flex; gap: 0.75rem; margin-bottom: 2rem; align-items: center; }
    nav a { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); text-decoration: none; padding: 4px 12px; border: 1px solid var(--border); border-radius: 4px; transition: all 0.15s; }
    nav a:hover { color: var(--text); border-color: var(--muted); }
    nav a.active { color: var(--text); border-color: var(--accent); background: rgba(96,165,250,0.1); }
    header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
    .sub { font-family: 'DM Mono', monospace; font-size: 0.85rem; color: var(--muted); }
    .charts-row { display: grid; grid-template-columns: 1fr 1.8fr; gap: 1.25rem; align-items: start; }
    .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .chart-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .chart-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    canvas { width: 100% !important; }
    .time-filters { display: flex; gap: 4px; }
    .tf { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .tf:hover { color: var(--text); border-color: var(--muted); }
    .tf.active { background: var(--accent); border-color: var(--accent); color: #0a0a0f; font-weight: 600; }
    .loading { text-align: center; padding: 4rem; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.85rem; }
    .dot { display: inline-block; animation: blink 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
    .error { color: #f87171; font-family: 'DM Mono', monospace; font-size: 13px; padding: 2rem; text-align: center; }
    .legend { display: flex; flex-wrap: wrap; gap: 0.6rem 1.2rem; margin-top: 1rem; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); cursor: pointer; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; transition: opacity 0.2s; }
    @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  </style>
</head>

  <header>
    <h1>YTD Dashboard</h1>
    <span class="sub" id="year-label"></span>
  </header>
  <div id="content">
    <div class="loading">Data laden<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
  </div>
  <script>
    document.getElementById("year-label").textContent = new Date().getFullYear() + " year-to-date";

    const PALETTE = [
      "#60a5fa","#4ade80","#fbbf24","#f472b6","#a78bfa",
      "#fb923c","#22d3ee","#e879f9","#f87171","#34d399",
      "#facc15","#38bdf8","#c084fc","#86efac","#fca5a5",
      "#6ee7b7","#fdba74"
    ];

    const PERIODS = [
      { label: "1W", days: 7 },
      { label: "1M", days: 30 },
      { label: "3M", days: 90 },
      { label: "6M", days: 180 },
      { label: "YTD", days: null },
      { label: "1J",  days: 365 },
      { label: "2J",  days: 730 },
      { label: "5J",  days: 1825 },
    ];

    let activePeriod = "1J";
    let lineChartInstance = null;
    let allWeeks = [];
    let rawDatasets = [];

    function getWeekKey(dateStr) {
      const d = new Date(dateStr);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(d.setDate(diff));
      return mon.toISOString().slice(0, 10);
    }

    function getCutoffDate(period) {
      const now = new Date();
      if (period.label === "YTD") return new Date(now.getFullYear(), 0, 1).toISOString().slice(0, 10);
      const cutoff = new Date(now);
      cutoff.setDate(cutoff.getDate() - period.days);
      return cutoff.toISOString().slice(0, 10);
    }

    function rebaseFromCutoff(weeks, datasets, cutoff) {
      const startIdx = weeks.findIndex(w => w >= cutoff);
      if (startIdx === -1) return { labels: weeks, rebased: datasets };
      const labels = weeks.slice(startIdx);
      const rebased = datasets.map(ds => {
        const sliced = ds.data.slice(startIdx);
        const firstVal = sliced.find(v => v !== null);
        if (firstVal === undefined) return { ...ds, data: sliced };
        return {
          ...ds,
          data: sliced.map(v => v !== null ? parseFloat((v - firstVal).toFixed(2)) : null)
        };
      });
      return { labels, rebased };
    }

    function updateLineChart(period) {
      activePeriod = period.label;
      document.querySelectorAll(".tf").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.period === period.label);
      });
      const cutoff = getCutoffDate(period);
      const { labels, rebased } = rebaseFromCutoff(allWeeks, rawDatasets, cutoff);
      lineChartInstance.data.labels = labels;
      lineChartInstance.data.datasets.forEach((ds, i) => { ds.data = rebased[i].data; });
      lineChartInstance.update();
    }

    function niceStep(range) {
      const rough = range / 8;
      const mag = Math.pow(10, Math.floor(Math.log10(rough)));
      const norm = rough / mag;
      let step;
      if (norm < 1.5) step = 1;
      else if (norm < 3) step = 2;
      else if (norm < 7) step = 5;
      else step = 10;
      return step * mag;
    }

    async function load() {
      try {
        const res  = await fetch("/api/finance");
        const json = await res.json();
        if (!json.ok) throw new Error(json.error);
        render(json.data);
      } catch (err) {
        document.getElementById("content").innerHTML = `<div class="error">Kon data niet laden: ${err.message}</div>`;
      }
    }

    function render(data) {
      document.getElementById("content").innerHTML = `
        <div class="charts-row">
          <div class="chart-wrap">
            <div class="chart-top">
              <div class="chart-label">YTD % — <span id="current-year"></span></div>
            </div>
            <canvas id="bar-chart"></canvas>
          </div>
          <div class="chart-wrap">
            <div class="chart-top">
              <div class="chart-label">Historisch %</div>
              <div class="time-filters" id="time-filters"></div>
            </div>
            <canvas id="line-chart"></canvas>
            <div class="legend" id="legend"></div>
          </div>
        </div>
      `;
      document.getElementById("current-year").textContent = new Date().getFullYear();

      const filtersEl = document.getElementById("time-filters");
      filtersEl.innerHTML = PERIODS.map(p => `
        <button class="tf ${p.label === activePeriod ? "active" : ""}" data-period="${p.label}">${p.label}</button>
      `).join("");

      const sorted = [...data]
        .map(d => ({ name: d.name, pct: d.ytd[d.ytd.length - 1]?.pct ?? 0 }))
        .sort((a, b) => a.pct - b.pct);
      const barLabels = sorted.map(d => d.name);
      const barValues = sorted.map(d => d.pct);
      const barColors = barValues.map(v => v >= 0 ? "#4ade80" : "#f87171");
      const minVal = Math.min(...barValues);
      const maxVal = Math.max(...barValues);
      const range  = maxVal - minVal || 10;
      const step   = niceStep(range);
      const yMin   = Math.floor(minVal / step) * step;
      const yMax   = Math.ceil(maxVal / step) * step;

      new Chart(document.getElementById("bar-chart"), {
        type: "bar",
        data: { labels: barLabels, datasets: [{ data: barValues, backgroundColor: barColors, borderRadius: 4, borderSkipped: false }] },
        options: {
          indexAxis: "y", responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: "#12121a", borderColor: "#1e1e2e", borderWidth: 1, titleColor: "#5a5a7a", bodyColor: "#e8e8f0", callbacks: { label: ctx => ` ${ctx.parsed.x >= 0 ? "+" : ""}${ctx.parsed.x.toFixed(2)}%` } }
          },
          scales: {
            x: { min: yMin, max: yMax, grid: { color: "#1e1e2e" }, ticks: { stepSize: step, color: "#5a5a7a", font: { family: "DM Mono", size: 11 }, callback: v => (v >= 0 ? "+" : "") + v.toFixed(0) + "%" } },
            y: { grid: { color: "transparent" }, ticks: { color: "#e8e8f0", font: { family: "DM Sans", size: 11 } } }
          }
        }
      });

      const weekMaps = data.map(({ hist }) => {
        const map = {};
        hist.forEach(p => { map[getWeekKey(p.date)] = p.pct; });
        return map;
      });
      allWeeks = [...new Set(weekMaps.flatMap(m => Object.keys(m)))].sort();
      rawDatasets = data.map(({ name }, i) => ({
        label: name,
        data: allWeeks.map(w => weekMaps[i][w] ?? null),
        borderColor: PALETTE[i % PALETTE.length],
        backgroundColor: "transparent",
        borderWidth: 1.5, pointRadius: 0, tension: 0.3, spanGaps: true,
      }));

      const defaultPeriod = PERIODS.find(p => p.label === activePeriod);
      const cutoff = getCutoffDate(defaultPeriod);
      const { labels: initLabels, rebased: initData } = rebaseFromCutoff(allWeeks, rawDatasets, cutoff);

      lineChartInstance = new Chart(document.getElementById("line-chart"), {
        type: "line",
        data: { labels: initLabels, datasets: initData.map((ds, i) => ({ ...rawDatasets[i], data: ds.data })) },
        options: {
          responsive: true,
          interaction: { mode: "nearest", intersect: true },
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: "#12121a", borderColor: "#1e1e2e", borderWidth: 1, titleColor: "#5a5a7a", bodyColor: "#e8e8f0", callbacks: { label: ctx => ctx.parsed.y !== null ? ` ${ctx.dataset.label}: ${ctx.parsed.y >= 0 ? "+" : ""}${ctx.parsed.y.toFixed(2)}%` : null } }
          },
          scales: {
            x: { grid: { color: "#1e1e2e" }, ticks: { color: "#5a5a7a", maxTicksLimit: 8, font: { family: "DM Mono", size: 11 } } },
            y: { grid: { color: "#1e1e2e" }, ticks: { color: "#5a5a7a", font: { family: "DM Mono", size: 11 }, callback: v => (v >= 0 ? "+" : "") + v + "%" } }
          }
        }
      });

      filtersEl.querySelectorAll(".tf").forEach(btn => {
        btn.addEventListener("click", () => {
          const period = PERIODS.find(p => p.label === btn.dataset.period);
          updateLineChart(period);
        });
      });

      const legend = document.getElementById("legend");
      legend.innerHTML = data.map((d, i) => `
        <div class="legend-item" onclick="toggleLine(${i})">
          <div class="legend-dot" id="dot-${i}" style="background:${PALETTE[i % PALETTE.length]}"></div>
          ${d.name}
        </div>
      `).join("");

      window.toggleLine = (i) => {
        const meta = lineChartInstance.getDatasetMeta(i);
        meta.hidden = !meta.hidden;
        document.getElementById(`dot-${i}`).style.opacity = meta.hidden ? "0.3" : "1";
        lineChartInstance.update();
      };
    }

    load();
  </script>

<script>
// ══════════════════════════════════════════════════════════════════
// EXECUTIVE SUMMARY — Kapitaalrotatie Signalen
// Classificeert alle 69 subsegmenten in Instroom / Uitstroom / Transitie
// ══════════════════════════════════════════════════════════════════

var ES_CACHE_KEY    = "es_data_cache";
var ES_CACHE_TS_KEY = "es_data_ts";
var ES_CACHE_TTL    = 30 * 60 * 1000; // 30 min

// ──────────────────────────────────────────────────────────────────
// CLASSIFICATIE LOGICA
// ──────────────────────────────────────────────────────────────────

// Instroom score (0-10): hoe sterk is het instroom signaal?
function esInstroomScore(seg) {
  var score = 0;

  // EMA8 alignment — vroegste momentum indicator (gewicht 2)
  if (seg.ema8align === "strong-bull") score += 2;
  else if (seg.ema8align === "bull")   score += 1;

  // RS Breuk omhoog — sector begint te leiden (gewicht 2)
  if (seg.rsBreak === "up" && (seg.rs || 0) > 0) score += 2;
  else if (seg.rsBreak === "up") score += 1;

  // Volume bevestiging (gewicht 2)
  if ((seg.volFlow || 0) >= 2.0) score += 2;
  else if ((seg.volFlow || 0) >= 1.5) score += 1;

  // Wekelijkse trend (gewicht 1)
  if (seg.weeklyTrend === "UP") score += 1;

  // Dagelijkse structuur (gewicht 1)
  if (seg.structure === "HH/HL") score += 1;

  // Mansfield positief en stijgend (gewicht 1)
  if ((seg.mansfield || 0) > 0 && seg.rsTrend === "up") score += 1;

  return score; // max 10
}

// Uitstroom score (0-10): hoe sterk is het uitstroom signaal?
function esUitstroomScore(seg) {
  var score = 0;

  // EMA8 negatief (gewicht 2)
  if (seg.ema8align === "strong-bear") score += 2;
  else if (seg.ema8align === "bear")   score += 1;

  // RS Breuk omlaag (gewicht 2)
  if (seg.rsBreak === "down" && (seg.rs || 0) < 0) score += 2;
  else if (seg.rsBreak === "down") score += 1;

  // Bearish structuur (gewicht 2)
  if (seg.structure === "LH/LL") score += 2;

  // Wekelijkse trend neerwaarts (gewicht 1)
  if (seg.weeklyTrend === "DOWN") score += 1;

  // Mansfield negatief (gewicht 1)
  if ((seg.mansfield || 0) < -0.5) score += 1;

  // Volume droogt op (gewicht 1)
  if ((seg.volFlow || 0) < 0.9) score += 1;

  // Momentum uitputting: hoog RSI + hoge Mansfield (gewicht 1)
  if ((seg.rsi || 50) > 70 && (seg.mansfield || 0) > 2.5) score += 1;

  return score; // max 11
}

// Classificeer een segment
function esClassify(seg) {
  var iScore = esInstroomScore(seg);
  var uScore = esUitstroomScore(seg);
  var earlyScore = seg._earlyScore || 0;

  // Momentum uitputting: hoog RSI + Mansfield maar RS begint te dalen
  var isExhausted = (seg.rsi || 50) > 70 &&
                    (seg.mansfield || 0) > 2.0 &&
                    seg.rsTrend === "down";

  // Verse cross (bull of bear) = transitie
  var isFreshCross = seg.ema21x50 === "bull-cross" || seg.ema21x50 === "bear-cross";

  // INSTROOM: duidelijk positief signaal
  if (iScore >= 6 && uScore <= 2) {
    return { type: "instroom", iScore: iScore, uScore: uScore, isExhausted: false };
  }

  // UITSTROOM: duidelijk negatief
  if (uScore >= 5 && iScore <= 2) {
    return { type: "uitstroom", iScore: iScore, uScore: uScore, isExhausted: isExhausted };
  }

  // TRANSITIE: verse cross OF momentum uitputting OF signaal opbouwend
  if (isFreshCross || isExhausted || (earlyScore === 3)) {
    return { type: "transitie", iScore: iScore, uScore: uScore,
             isExhausted: isExhausted, isFreshCross: isFreshCross };
  }

  return { type: "neutraal", iScore: iScore, uScore: uScore };
}

// ──────────────────────────────────────────────────────────────────
// ACTIE BEPALEN
// ──────────────────────────────────────────────────────────────────
function esAction(seg, classification) {
  var type = classification.type;

  if (type === "instroom") {
    if (classification.iScore >= 8) {
      return { label: "📈 Zoek aandelen", cls: "es-action-buy",
               tip: "Sterk instroom signaal — selecteer aandelen binnen dit segment" };
    }
    return { label: "👀 Monitor", cls: "es-action-watch",
             tip: "Instroom bevestigt — houd aan voor bevestiging" };
  }

  if (type === "uitstroom") {
    if (classification.isExhausted) {
      return { label: "⚠️ Neem winst", cls: "es-action-reduce",
               tip: "Momentum uitgeput: RSI>70 + Mansfield hoog maar RS daalt" };
    }
    if (classification.uScore >= 7) {
      return { label: "🚪 Roteer weg", cls: "es-action-sell",
               tip: "Kapitaal stroomt uit — exit positie of roteer naar sterker segment" };
    }
    return { label: "⬇️ Verlaag pos.", cls: "es-action-reduce",
             tip: "Zwakker wordend segment — verlaag positiegrootte" };
  }

  if (type === "transitie") {
    if (classification.isFreshCross && seg.ema21x50 === "bull-cross") {
      return { label: "⚡ Verse cross", cls: "es-action-watch",
               tip: "EMA21 kruiste net boven EMA50 — vroeg maar nog niet bevestigd" };
    }
    if (classification.isFreshCross && seg.ema21x50 === "bear-cross") {
      return { label: "⚠️ Bear cross", cls: "es-action-reduce",
               tip: "EMA21 kruiste net onder EMA50 — momentum keert negatief" };
    }
    if (classification.isExhausted) {
      return { label: "⚠️ Uitgeput", cls: "es-action-reduce",
               tip: "Trend ver gevorderd: RSI overbought + Mansfield hoog + RS draait" };
    }
    return { label: "👀 Opbouwend", cls: "es-action-watch",
             tip: "Signaal aan het opbouwen — nog geen vol bevestiging" };
  }

  return null; // neutraal — niet tonen
}

// ──────────────────────────────────────────────────────────────────
// DATA LADEN
// ──────────────────────────────────────────────────────────────────
function loadExecutiveSummary(forceRefresh) {
  var url = localStorage.getItem("deepdive_appsscript_url");
  if (!url) {
    renderESSkeleton();
    return;
  }

  // Check cache
  if (!forceRefresh) {
    var ts   = parseInt(localStorage.getItem(ES_CACHE_TS_KEY) || "0");
    var blob = localStorage.getItem(ES_CACHE_KEY);
    if (blob && Date.now() - ts < ES_CACHE_TTL) {
      try {
        var parsed = JSON.parse(blob);
        renderES(parsed.data);
        updateESMeta(parsed.lastUpdated, false);
        return;
      } catch(e) {}
    }
  }

  updateESMeta(null, true);
  fetch(url + "?tab=deepdive&_t=" + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json.data) throw new Error("Geen data");
      localStorage.setItem(ES_CACHE_KEY,    JSON.stringify(json));
      localStorage.setItem(ES_CACHE_TS_KEY, String(Date.now()));
      renderES(json.data);
      updateESMeta(json.lastUpdated, false);
    })
    .catch(function(e) {
      document.getElementById("esContent").innerHTML =
        '<div class="es-loading" style="color:#ef4444">⚠️ Kon data niet laden: ' + e.message + '</div>';
      document.getElementById("esPulse").style.background = "#ef4444";
    });
}

function updateESMeta(lastUpdated, loading) {
  var pulse = document.getElementById("esPulse");
  var upd   = document.getElementById("esLastUpdate");
  if (loading) {
    pulse.style.background = "#f59e0b";
    upd.textContent = "Laden...";
  } else {
    pulse.style.background = "#22c55e";
    var ts = lastUpdated ? new Date(lastUpdated).toLocaleTimeString("nl-NL") : new Date().toLocaleTimeString("nl-NL");
    upd.textContent = "Bijgewerkt: " + ts;
  }
}

// ──────────────────────────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────────────────────────
function renderES(data) {
  // Verrijk data met computed signals
  var enriched = data.map(function(seg) {
    var earlyScore = esComputeEarlyScore(seg);
    return Object.assign({}, seg, { _earlyScore: earlyScore });
  });

  // Classificeer alles
  var instroom  = [];
  var uitstroom = [];
  var transitie = [];

  enriched.forEach(function(seg) {
    var cls = esClassify(seg);
    var act = esAction(seg, cls);
    if (!act) return; // neutraal overslaan

    var item = { seg: seg, cls: cls, action: act };

    if (cls.type === "instroom")  instroom.push(item);
    if (cls.type === "uitstroom") uitstroom.push(item);
    if (cls.type === "transitie") transitie.push(item);
  });

  // Sorteer op score
  instroom.sort(function(a,b)  { return b.cls.iScore - a.cls.iScore; });
  uitstroom.sort(function(a,b) { return b.cls.uScore - a.cls.uScore; });

  document.getElementById("esContent").innerHTML =
    '<div class="es-blocks">' +
    renderESBlock("instroom",  "🟢 Instroom", "instroom",  instroom,  10) +
    renderESBlock("uitstroom", "🔴 Uitstroom","uitstroom", uitstroom, 11) +
    renderESBlock("transitie", "🟡 Transitie","transitie", transitie, 10) +
    '</div>';
}

function renderESBlock(id, title, cls, items, maxScore) {
  var rows = "";
  if (items.length === 0) {
    rows = '<tr><td colspan="5"><div class="es-empty">Geen signalen momenteel</div></td></tr>';
  } else {
    rows = items.slice(0, 8).map(function(item) {
      var seg = item.seg, c = item.cls, act = item.action;
      var scoreW = Math.round((cls === "instroom" ? c.iScore : c.uScore) / maxScore * 6);
      var dots = "";
      for (var i = 0; i < 6; i++) {
        dots += '<div class="es-dot ' + (i < scoreW ? (cls==="uitstroom"?"es-dot-warn":"es-dot-on") : "es-dot-off") + '"></div>';
      }
      return '<tr>' +
        '<td><div class="es-seg-name">' + (seg.icon||"") + " " + seg.name + '</div>' +
             '<div class="es-seg-sub">' + (seg.proxy||"") + '</div></td>' +
        '<td><div class="es-score-dots">' + dots + '</div></td>' +
        '<td>' + esTagEMA8(seg.ema8align) + '</td>' +
        '<td>' + esTagRS(seg.rsBreak, seg.rs) + '</td>' +
        '<td><span class="es-action ' + act.cls + '" title="' + act.tip + '">' + act.label + '</span></td>' +
      '</tr>';
    }).join("");
  }

  return '<div class="es-block">' +
    '<div class="es-block-header ' + cls + '">' + title +
    '  <span style="opacity:.6;font-size:10px;font-weight:400">' + items.length + ' segment' + (items.length!==1?"en":"") + '</span></div>' +
    '<table class="es-table">' +
    '<thead><tr><th>Segment</th><th>Sterkte</th><th>EMA8</th><th>RS</th><th>Actie</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}

// ──────────────────────────────────────────────────────────────────
// CELL RENDERERS
// ──────────────────────────────────────────────────────────────────
function esTagEMA8(v) {
  var map = {
    "strong-bull": ["es-tag-sbull",  "⚡ S-Bull"],
    "bull":        ["es-tag-bull-cross", "↑ Bull"],
    "bull-cross":  ["es-tag-bull-cross", "↑ NEW"],
    "bear":        ["es-tag-sbear",  "↓ Bear"],
    "strong-bear": ["es-tag-sbear",  "⚡ S-Bear"],
    "bear-cross":  ["es-tag-bear-cross", "↓ NEW"],
  };
  var info = map[v];
  if (!info) return '<span style="color:#6b7591">—</span>';
  return '<span class="es-tag ' + info[0] + '">' + info[1] + '</span>';
}

function esTagRS(rsBreak, rs) {
  if (rsBreak === "up")   return '<span class="es-tag es-tag-bull-cross">🔼 Break</span>';
  if (rsBreak === "down") return '<span class="es-tag es-tag-bear-cross">🔽 Break</span>';
  if ((rs||0) > 1)  return '<span style="color:#22c55e;font-size:10px">+' + (rs||0).toFixed(1) + '</span>';
  if ((rs||0) < -1) return '<span style="color:#ef4444;font-size:10px">' + (rs||0).toFixed(1) + '</span>';
  return '<span style="color:#6b7591">—</span>';
}

// ──────────────────────────────────────────────────────────────────
// VROEG SCORE BEREKENING (zelfde als sector-deep.html)
// ──────────────────────────────────────────────────────────────────
function esComputeEarlyScore(seg) {
  var ema8ok  = ["strong-bull","bull"].includes(seg.ema8align) ? 1 : 0;
  var wtOk    = seg.weeklyTrend === "UP" ? 1 : 0;
  var ema8pts = (ema8ok && wtOk) ? 2 : (ema8ok || wtOk) ? 1 : 0;
  var rsBreakOk = seg.rsBreak === "up" ? 1 : 0;
  var rsPosOk   = (seg.rs || 0) > 0 ? 1 : 0;
  var rsPts   = (rsBreakOk && rsPosOk) ? 2 : rsBreakOk ? 1 : 0;
  var vol5pts = (seg.volFlow   || 0) >= 1.5 ? 1 : 0;
  var vol10pts= (seg.volFlow30 || 0) >= 1.3 ? 1 : 0;
  return ema8pts + rsPts + vol5pts + vol10pts;
}

// ──────────────────────────────────────────────────────────────────
// SKELETON (geen URL ingesteld)
// ──────────────────────────────────────────────────────────────────
function renderESSkeleton() {
  document.getElementById("esContent").innerHTML =
    '<div class="es-loading" style="color:#6b7591">' +
    '🔗 Stel je Apps Script URL in via de <a href="sector-deep.html" style="color:#3d82f6">Deep Dive pagina</a> om live rotatie signalen te zien.' +
    '</div>';
}

// ──────────────────────────────────────────────────────────────────
// INIT — laad automatisch bij pagina open
// ──────────────────────────────────────────────────────────────────
(function() {
  // Wacht tot DOM geladen is
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function() { loadExecutiveSummary(false); });
  } else {
    loadExecutiveSummary(false);
  }
})();
</script>
